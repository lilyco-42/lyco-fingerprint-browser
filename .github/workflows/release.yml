name: LYCO Browser CI & Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Tests + Windows x64 installer (GitHub-hosted runner)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (only on GitHub Actions)
        run: npm ci --no-audit --no-fund
      - name: Unit tests (mocked; no live payment requests)
        run: npm test
      - name: Compile + build Windows installers (only on GitHub Actions)
        run: npm run make
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LYCO-Browser-Windows-x64
          path: out/make/**/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LYCO-Browser-Windows-x64
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          prerelease: true
