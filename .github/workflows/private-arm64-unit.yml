name: Private Linux lifecycle unit gate

on:
  pull_request:
    branches: [main]
    paths:
      - src/main/chrome-manager.ts
      - src/main/chrome-manager.test.ts
      - .github/workflows/private-arm64-unit.yml

permissions:
  contents: read

jobs:
  unit:
    # Personal, private, one-job runner. Never execute fork or bot submissions.
    if: >-
      github.repository == 'lilyco-42/lyco-fingerprint-browser' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    runs-on: [self-hosted, Linux, lyco-fingerprint-private]
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=256
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unit regressions only (not Windows or privacy acceptance)
        run: npm test -- --maxWorkers=1 --minWorkers=1 --reporter=json --outputFile=unit-results.json
